spring:
  application:
    name: horse-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/horse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:horse}
    password: ${DB_PASSWORD:horse_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-32-bytes}

springdoc:
  api-docs:
    enabled: false
