name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: mise run install

      - name: Verify all
        run: mise run verify:all
