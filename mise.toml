pnpm --dir frontend/packages/api-client exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler src/index.ts
'''

[tasks."verify:m0-06"]
description = "Verify changed-path routing"
run = '''
bash -n scripts/verify-changed.sh scripts/tests/verify-changed-test.sh
./scripts/tests/verify-changed-test.sh
'''

