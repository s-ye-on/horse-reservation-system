rg -Fq 'MySQL `EXPLAIN FORMAT=JSON` 결과' docs/architecture/mvp-3-1-stabilization-plan.md
rg -Fq 'MySQL deadlock 오류 `1213`만 전체 트랜잭션 경계 밖에서 제한적으로 재시도한다.' docs/architecture/mvp-3-1-stabilization-plan.md
rg -Fq 'Reservation 저장 이후 idempotency 완료 기록 직전에 장애를 주입했을 때 전체 변경이 rollback되는 통합 테스트를 둔다.' docs/architecture/mvp-3-1-stabilization-plan.md
rg -Fq 'ORDER BY (expires_at IS NULL) ASC' docs/architecture/mvp-3-1-stabilization-plan.md
rg -Fq '`America/Los_Angeles`' docs/architecture/mvp-3-1-stabilization-plan.md
'''

