# React SPA 정적 파일 제공 + /api 요청을 backend 컨테이너로 전달한다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt가 이 서버의 IP 소유/제어 여부를 검증할 때 사용한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;

    # proxy_pass 뒤에 URI 를 붙이지 않아 /api/... 경로가 그대로 backend 로 전달된다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Actuator 는 외부에 공개하지 않는다. healthcheck 는 Docker 내부 네트워크에서만 호출한다.
    location /actuator/ {
        return 404;
    }

    # SPA 라우팅: 존재하지 않는 정적 경로는 index.html 로 fallback 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
