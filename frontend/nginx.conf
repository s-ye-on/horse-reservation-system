server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge는 HTTPS redirect에서 제외한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 인증서 검증 경로를 제외한 모든 HTTP 요청은 HTTPS로 보낸다.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/horse-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horse-ip/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        # proxy_pass 뒤에 URI를 붙이지 않아 /api/... 경로를 그대로 backend로 전달한다.
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
